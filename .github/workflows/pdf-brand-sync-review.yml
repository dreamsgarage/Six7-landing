name: Prepare PDF and brand synchronization
on:
  push:
    branches: [review/pdf-brand-sync-20261113]
    paths: [.github/workflows/pdf-brand-sync-review.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install maintenance-only renderers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-urw-base35
          python -m pip install 'weasyprint==68.0' 'PyMuPDF==1.26.3' 'Pillow==11.3.0'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python scripts/render_one_pagers.py
      - run: python scripts/prepare_site_icons.py
      - name: Store candidate binaries on the review branch only
        run: |
          git config user.name 'Six7 artifact preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add one-pagers/release.json mockup-sources/brand
          git add -f dist/assets/six7-one-pager-en.pdf dist/assets/six7-one-pager-es.pdf dist/assets/six7-one-pager-en-es.pdf
          git diff --staged --quiet || git commit -m 'Prepare source-derived S7 icons and current bilingual PDFs'
          git push origin HEAD:review/pdf-brand-sync-20261113
          git rev-parse HEAD > pdf-brand-evidence/candidate-commit.txt
          git ls-tree -r HEAD > pdf-brand-evidence/candidate-tree.txt
      - name: Preserve exact source and browser icon previews
        if: always()
        run: |
          mkdir -p pdf-brand-evidence/icons
          cp mockup-sources/brand/* pdf-brand-evidence/icons/ || true
          tar --exclude=.git --exclude=pdf-brand-evidence -czf /tmp/candidate-source.tar.gz .
          mv /tmp/candidate-source.tar.gz pdf-brand-evidence/candidate-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six7-pdf-brand-review
          path: pdf-brand-evidence/
          retention-days: 7
